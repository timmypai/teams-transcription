name: operate
on:
  workflow_dispatch:
    inputs:
      op:
        description: Reviewed UI operation
        type: choice
        options: [look, calendar-occurrences, calendar-settings]
        required: true
      args:
        description: Public JSON only (look path or primary Calendar read switch); no identifiers or consent
        type: string
        default: '{}'
      request:
        description: devflow operate correlation ID
        type: string
        default: ''
run-name: operate ${{ inputs.op }} ${{ inputs.request }}
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
concurrency:
  group: manual-target-teams-transcription
  cancel-in-progress: false
jobs:
  operate:
    if: github.repository == 'timmypai/teams-transcription' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, devflow]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - name: Reviewed default tip admission before secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/target_admission.py --output "$RUNNER_TEMP/teams-operate-admission.json"
      - name: Operate installed service without Join or scheduler changes
        env:
          DEVFLOW_OP: ${{ inputs.op }}
          DEVFLOW_OP_ARGS: ${{ inputs.args }}
          DEVFLOW_OPS_ENV: ${{ secrets.DEVFLOW_OPS_ENV }}
        run: |
          case "$DEVFLOW_OP" in look|calendar-occurrences|calendar-settings) ;; *) exit 2;; esac
          bash .devflow/operate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: devflow-operate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .devflow/evidence/operate/${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: ignore
