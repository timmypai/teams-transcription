name: Standalone assistant offline validation

# Initial rollout is manual only; automatic triggers need separate cost approval.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meeting-functional-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlled-contracts:
    if: vars.ENABLE_HOSTED_CI == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout selected source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install declared Python dependencies
        run: python -m pip install --disable-pip-version-check . 'build==1.3.0'
      - name: Build source and wheel
        run: python -m build --outdir "$RUNNER_TEMP/assistant-dist"
      - name: Actual CLI help without service or model
        run: python -m teams_transcription --help
      - name: Controlled contracts without credentials or browser
        env:
          CODEX_HOME: ${{ runner.temp }}/empty-codex-home
        run: python tools/ci_contracts.py "$RUNNER_TEMP/offline-results"
      - name: Validate repo-local skill inventory without execution
        run: python tools/check_repo_skills.py > "$RUNNER_TEMP/offline-results/skills-inventory.json"
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-results/
          retention-days: 7
          if-no-files-found: warn
