name: Manual target deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
concurrency:
  group: manual-target-teams-transcription
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'timmypai/teams-transcription' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, devflow]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - name: Default tip and independent review before secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/target_admission.py --output "$RUNNER_TEMP/teams-admission.json"
      - name: Build, private init, fenced switch, readonly smoke and exact rollback
        env:
          GH_TOKEN: ${{ github.token }}
          DEVFLOW_APP_ENV: ${{ secrets.DEVFLOW_APP_ENV }}
        run: bash .devflow/deploy.sh
      - name: Bounded evidence only (no runtime config, credentials or raw logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devflow-evidence-deploy-${{ github.sha }}-${{ github.run_attempt }}
          path: .devflow/evidence-deploy-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: warn
