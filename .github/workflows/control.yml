name: Manual same-deployment control
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bound single Join, read view, disable output, verified stop or empty private home; no grant
        type: choice
        options: [view, join, output-disable, stop, prepare-home]
        default: view
        required: true
      id:
        description: Existing occurrence (view/join) or session (output-disable/stop), 32 lowercase hex; empty for prepare-home
        type: string
        required: false
      request_sha:
        description: Owner-issued fresh request for Join, same run binding for output-disable/stop; not a grant
        type: string
        default: ''
      revision:
        description: Owner-issued occurrence revision for Join only; empty otherwise
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
concurrency:
  group: manual-target-teams-transcription
  cancel-in-progress: false
jobs:
  control:
    if: github.repository == 'timmypai/teams-transcription' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, devflow]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - name: Reviewed default tip only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/target_admission.py --output "$RUNNER_TEMP/teams-control-admission.json"
      - name: Fixed helper to same-UID Unix control
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          TARGET_ID: ${{ inputs.id }}
          REQUEST_SHA: ${{ inputs.request_sha }}
          REVISION: ${{ inputs.revision }}
        run: |
          args=("$OPERATION" --id "$TARGET_ID" --request-sha "$REQUEST_SHA")
          if [[ -n "$REVISION" ]]; then args+=(--revision "$REVISION"); fi
          python3 deploy/target_deploy.py "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devflow-evidence-control-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .devflow/evidence-deploy-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: warn
