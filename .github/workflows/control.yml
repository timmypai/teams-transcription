name: Manual same-deployment control
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Stage the only eligible occurrence, attest fresh presence and media consent, or control the bound run
        type: choice
        options: [preview, join-confirmed-present-and-media, view, output-disable, stop, prepare-home]
        default: preview
        required: true
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
concurrency:
  group: manual-target-teams-transcription
  cancel-in-progress: false
jobs:
  control:
    if: github.repository == 'timmypai/teams-transcription' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, devflow]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - name: Reviewed default tip only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/target_admission.py --output "$RUNNER_TEMP/teams-control-admission.json"
      - name: Fixed helper to same-UID Unix control
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          DEVFLOW_OPS_ENV: ${{ (inputs.operation == 'preview' || inputs.operation == 'join-confirmed-present-and-media') && secrets.DEVFLOW_OPS_ENV || '' }}
        run: |
          case "$OPERATION" in preview|join-confirmed-present-and-media|view|output-disable|stop|prepare-home) ;; *) exit 2;; esac
          python3 -B deploy/target_deploy.py "$OPERATION"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devflow-evidence-control-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .devflow/evidence-deploy-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: warn
