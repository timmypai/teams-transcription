[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-transcription"
version = "0.3.0"
description = "Standalone Teams calendar assistant with SQLite memory and native Live voice"
requires-python = ">=3.11"
dependencies = [
    "playwright==1.62.0",
    "starlette==1.6.0",
    "httpx==0.28.1",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
bridge-test = ["websockets>=16,<17"]

[project.scripts]
teams-transcription = "teams_transcription.cli:main"

[tool.setuptools.packages.find]
include = ["teams_transcription*"]

[tool.setuptools.package-data]
teams_transcription = ["static/*.css", "static/*.js", "static/*.html"]
