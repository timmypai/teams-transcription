<html lang="zh-Hant">
<head>

<style>
:root{--paper:#f7f4ed;--white:#fffdf8;--ink:#292e2b;--muted:#686b61;--rule:#d9d6cc;--accent:#a34d35;--wash:#f1e5d9;--green:#3c6552;--serif:Georgia,"Noto Serif TC","Songti TC",serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;font-size:14px;line-height:1.65}button,input{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:1px solid var(--rule);border-radius:3px;padding:7px 13px}button:hover{background:var(--wash);border-color:#a69c8e}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{cursor:default;opacity:.5}h1,h2,h3,p{margin:0}h1,h2{font-family:var(--serif);font-weight:500}h1{font-size:36px;letter-spacing:.02em}h2{font-size:24px}h3{font-size:15px;font-weight:600}small,.muted{color:var(--muted)}.wrap{max-width:1320px;padding:0 48px 120px;margin:auto}.masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--ink);padding:23px 0 20px}.brand{font-family:var(--serif);font-size:23px;letter-spacing:.14em}.brand-sub{font-size:10px;letter-spacing:.2em;color:var(--muted);margin-top:2px}.header-right{display:flex;align-items:center;gap:18px}.demo-label{font-size:11px;letter-spacing:.08em;color:var(--accent);border:1px solid #cab5a5;padding:3px 8px}.text-button{border:0;padding:6px 2px;text-decoration:underline;text-underline-offset:5px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.14em;font-weight:600;text-transform:uppercase}.month-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:26px 0 21px}.month-title{display:flex;align-items:baseline;gap:15px}.month-title h1{font-size:43px}.month-caption{color:var(--muted);font-family:var(--serif);font-size:16px}.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.controls input{border:1px solid var(--rule);background:var(--white);color:var(--ink);padding:6px;max-width:150px;border-radius:3px}.nav-arrow{font-size:18px;padding:4px 13px}.calendar-scroll{overflow-x:auto;border-top:1px solid var(--ink)}.calendar{min-width:700px}.weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{padding:9px 0;color:var(--muted);font-size:11px;letter-spacing:.12em;border-bottom:1px solid var(--rule)}.weekdays span{padding-left:12px}.day{min-height:94px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:7px 6px 6px;position:relative}.day:nth-child(7n){border-right:0}.day.weekend{background:#f0eee7}.day.outside{color:#aaa99e;background:#eeece5}.day.selected{background:#efe0d1;box-shadow:inset 0 3px var(--accent)}.date-button{padding:0;width:29px;height:27px;border:0;font-size:12px;display:inline-flex;align-items:center;justify-content:center}.date-button.today{background:var(--accent);color:#fff;border-radius:50%}.event{display:block;width:100%;text-align:left;border:0;border-left:2px solid #9d9e8d;padding:4px 5px;background:#e9e7df;margin-top:5px;border-radius:0;font-size:11px;line-height:1.45;white-space:normal}.event.live{border-color:var(--accent);background:#f8eee3}.event.selected-event{outline:1px solid #ae7358}.event strong{display:block;font-weight:600;margin:2px 0}.event-meta{font-size:10px;color:#5f635b}.calendar-note{display:flex;justify-content:space-between;gap:12px;padding:11px 0;color:var(--muted);font-size:11px}.mobile-hint{display:none}.date-agenda{display:grid;grid-template-columns:180px 1fr;gap:24px;border-top:1px solid var(--ink);margin-top:12px;padding-top:22px}.date-heading{font-family:var(--serif);font-size:25px}.agenda-row{display:grid;grid-template-columns:105px 1fr auto;gap:22px;align-items:center;padding:2px 0 20px}.agenda-time{font-family:var(--serif);font-size:19px}.agenda-row h3{font-size:19px;margin:4px 0}.primary{background:var(--ink);border-color:var(--ink);color:#fffdf8;padding:10px 18px}.primary:hover{background:#4b5049;color:white}.status{display:inline-block;font-size:11px;letter-spacing:.03em;color:var(--muted)}.status.live{color:var(--accent);font-weight:650}.status.live:before{content:"";display:inline-block;background:var(--accent);width:6px;height:6px;border-radius:50%;margin-right:6px}.status.ended{color:var(--green)}.tag{color:var(--muted);font-size:11px;margin-left:9px}.context-teaser{font-size:12px;color:var(--muted);margin-top:5px;max-width:640px}.empty{padding:23px 0 28px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-weight:500;margin-bottom:5px}.breadcrumb{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:21px 0;border-bottom:1px solid var(--rule)}.breadcrumb .controls{font-size:12px}.dossier-heading{padding:29px 0 24px;display:flex;justify-content:space-between;gap:25px;align-items:flex-end}.dossier-heading h1{font-size:37px;margin:8px 0}.meeting-meta{color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}.folio{color:#a6a293;font-family:var(--serif);font-size:55px;line-height:1;text-align:right}.folio small{font-family:inherit;font-size:12px;display:block;margin-top:9px;letter-spacing:.1em}.section-title{display:flex;align-items:baseline;gap:13px;margin-bottom:18px}.section-number{font-size:11px;color:var(--accent);font-family:var(--serif)}.prior{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);padding:23px 0 27px}.prior-grid{display:grid;grid-template-columns:1fr 1fr;gap:55px}.small-heading{font-size:12px;color:var(--muted);margin-bottom:10px}.conclusions{list-style:none;padding:0;margin:0}.conclusions li{padding:0 0 12px 20px;position:relative;line-height:1.85}.conclusions li:before{content:"—";position:absolute;left:0;color:var(--accent)}.task-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:7px}.task-filter{font-size:11px;display:flex;gap:6px;align-items:center;color:var(--muted)}input[type=checkbox]{accent-color:var(--accent)}.task{padding:9px 0;border-bottom:1px solid var(--rule)}.task:last-child{border-bottom:0}.task-meta{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:4px}.task-state{color:var(--accent)}.task.completed .task-state{color:var(--green)}.current{padding:27px 0}.current-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.current-heading .section-title{margin-bottom:3px}.live-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.live-controls button{font-size:12px}.feed-note{font-size:11px;color:var(--muted);margin-left:25px}.reading-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:40px}.reading-column{min-width:0}.reading-column+ .reading-column{border-left:1px solid var(--rule);padding-left:32px}.reading-title{border-bottom:1px solid var(--ink);padding-bottom:11px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.reading-title h3{font-family:var(--serif);font-size:21px;font-weight:500}.reading-title small{font-size:11px}.transcript-row{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule)}time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px;padding-top:3px}.transcript-row p{font-size:14px;line-height:1.95}.qa-row{padding:15px 0 18px;border-bottom:1px solid var(--rule)}.qa-question{font-weight:600;line-height:1.8;margin-bottom:9px}.qa-letter{font-family:var(--serif);color:var(--accent);padding-right:9px}.qa-answer{line-height:1.85;color:#464c43}.qa-source{margin-top:10px;font-size:11px;color:var(--muted)}.session-state{border-top:1px solid var(--rule);padding:26px 0 34px}.session-state h3{font-family:var(--serif);font-size:24px;margin-bottom:8px}.series{border-top:1px solid var(--ink);padding-top:23px;margin-top:10px}.series-list{display:flex;gap:10px;flex-wrap:wrap}.series-item{text-align:left;min-width:155px;padding:12px 15px}.series-item[aria-current=true]{border-color:var(--accent);background:var(--wash)}.series-date{font-family:var(--serif);font-size:18px;display:block}.series-item .status{display:block}.footnote{font-size:11px;color:var(--muted);border-top:1px solid var(--rule);padding-top:17px;margin-top:33px}.settings{max-width:800px;margin:35px auto}.settings h1{margin:10px 0}.settings-intro{color:var(--muted);margin:8px 0 32px}.settings-section{border-top:1px solid var(--ink);padding:24px 0}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:25px;border-bottom:1px solid var(--rule);padding:20px 0}.setting-row p{font-size:12px;color:var(--muted);margin-top:3px}.setting-value{white-space:nowrap;color:var(--muted);font-size:12px}.switch{width:20px;height:20px;flex-shrink:0}.settings-notice{font-size:12px;padding:14px 17px;border-left:2px solid var(--accent);background:var(--wash);margin-top:25px}.live-update{font-variant-numeric:tabular-nums}.back{font-size:12px}.no-history{color:var(--muted);padding-bottom:5px}
@media(min-width:1500px){.day{min-height:107px}}@media(max-width:900px){.wrap{padding:0 25px 120px}.month-heading{align-items:flex-start;flex-direction:column;gap:12px}.month-title h1{font-size:37px}.prior-grid{gap:28px}.reading-grid{gap:25px}.reading-column+ .reading-column{padding-left:24px}.dossier-heading h1{font-size:31px}.current-heading{flex-direction:column}.date-agenda{grid-template-columns:130px 1fr;gap:15px}.agenda-row{grid-template-columns:1fr auto;gap:12px}.agenda-time{grid-column:1/-1;font-size:15px}.folio{font-size:42px}}
@media(max-width:600px){.wrap{padding:0 18px 125px}.masthead{padding:18px 0}.brand{font-size:20px}.brand-sub{font-size:8px}.header-right{gap:12px}.demo-label{font-size:10px;padding:2px 5px}.month-title{gap:10px}.month-title h1{font-size:33px}.month-caption{font-size:13px}.controls{gap:6px}.controls input{max-width:140px}.calendar-note{display:block}.mobile-hint{display:block;margin-top:4px}.date-agenda{grid-template-columns:1fr;gap:13px}.date-heading{font-size:23px}.agenda-row{grid-template-columns:1fr}.agenda-row .primary{justify-self:start}.agenda-time{grid-column:auto}.breadcrumb{align-items:flex-start;flex-direction:column;gap:12px}.dossier-heading{padding:22px 0;gap:10px}.dossier-heading h1{font-size:28px}.folio{display:none}.meeting-meta{gap:6px 13px}.prior-grid,.reading-grid{grid-template-columns:1fr;gap:23px}.reading-column+ .reading-column{border-left:0;padding-left:0}.current-heading{gap:14px}.section-title h2{font-size:22px}.feed-note{margin-left:0}.task-heading{align-items:flex-start}.series-item{min-width:140px;flex:1}.setting-row{align-items:flex-start}.settings h1{font-size:30px}.settings{margin-top:25px}.transcript-row{grid-template-columns:43px 1fr;gap:9px}}
</style>
</head>
<body>
<div class="wrap">
<header class="masthead"><div><div class="brand">小白會議</div><div class="brand-sub">行事曆與會議記錄</div></div><div class="header-right"><span class="demo-label">示範資料</span><button id="settings-button" class="text-button">設定</button></div></header>
<main id="workspace"></main>
</div>
<script src="fixture.js"></script>
<script>
(function(){
'use strict';
const P=window.MeetingPrototype,E=P.escape,root=document.getElementById('workspace');
let selectedDate=P.today,month=P.today.slice(0,7),selectedId='product-live',view='calendar',returnView='calendar',showCompleted=false,compactPreference=false;
const weekday=['日','一','二','三','四','五','六'];
const dateObj=s=>new Date(s+'T12:00:00Z');
const dateString=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=dateObj(s);d.setUTCDate(d.getUTCDate()+n);return dateString(d)};
const shortDate=s=>`${Number(s.slice(5,7))} 月 ${Number(s.slice(8,10))} 日`;
const fullDate=s=>`${s.slice(0,4)} 年 ${shortDate(s)}（${weekday[dateObj(s).getUTCDay()]}）`;
const statusName={live:'進行中',upcoming:'尚未開始',ended:'已結束'};
const status=m=>`<span class="status ${m.status}">${statusName[m.status]}</span>`;
const kind=m=>m.kind==='series'?`系列・${E(m.seriesName)}`:'單場會議';
const onDate=d=>P.meetings.filter(m=>m.date===d).sort((a,b)=>a.start.localeCompare(b.start));
const feed=P.createFeed(updateFeed);
function focusHeading(){const h=root.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}window.scrollTo(0,0)}
function dateControls(dossier=false){return `<div class="controls"><button class="nav-arrow" id="${dossier?'previous-day':'previous-month'}" aria-label="${dossier?'前一天':'上一個月'}">‹</button><button id="today-button">今天</button><button class="nav-arrow" id="${dossier?'next-day':'next-month'}" aria-label="${dossier?'後一天':'下一個月'}">›</button><input id="date-picker" aria-label="選擇日期${dossier?'並返回月曆':''}" type="date" value="${selectedDate}"></div>`}
function renderCalendar(){
view='calendar';document.getElementById('settings-button').textContent='設定';
const first=dateObj(month+'-01'),offset=(first.getUTCDay()+6)%7,start=addDays(month+'-01',-offset),last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)),count=Math.ceil((offset+last.getUTCDate())/7)*7;
let days='';
for(let i=0;i<count;i++){const date=addDays(start,i),events=onDate(date),outside=date.slice(0,7)!==month;days+=`<div class="day ${outside?'outside':''} ${i%7>4?'weekend':''} ${date===selectedDate?'selected':''}"><button class="date-button ${date===P.today?'today':''}" data-date="${date}" aria-label="${fullDate(date)}${events.length?'，有會議':'，沒有會議'}" aria-pressed="${date===selectedDate}" ${date===P.today?'aria-current="date"':''}>${Number(date.slice(8))}</button>${events.map(m=>`<button class="event ${m.status} ${m.id===selectedId?'selected-event':''}" data-meeting="${m.id}" aria-label="開啟 ${E(m.title)}，${fullDate(m.date)}，${statusName[m.status]}"><span>${m.start} · ${statusName[m.status]}</span><strong>${E(m.title)}</strong><span class="event-meta">${m.kind==='series'?'系列':'單場'}${m.id==='product-live'?' · 開啟手記 →':''}</span></button>`).join('')}</div>`}
const events=onDate(selectedDate);
root.innerHTML=`<section aria-labelledby="calendar-title"><div class="month-heading"><div><div class="eyebrow">會議行事曆</div><div class="month-title"><h1 id="calendar-title">${Number(month.slice(5))} 月 <span style="font-size:.55em">${month.slice(0,4)}</span></h1><span class="month-caption">月曆 / 會議記錄</span></div></div>${dateControls()}</div><div class="calendar-scroll" role="region" aria-label="月曆，可橫向捲動" tabindex="0"><div class="calendar"><div class="weekdays">${['週一','週二','週三','週四','週五','週六','週日'].map(d=>`<span>${d}</span>`).join('')}</div><div class="month-grid">${days}</div></div></div><div class="calendar-note"><span>選擇日期查看當日安排；點選會議，展開完整記錄。</span><span>今天 ${P.today.replaceAll('-',' / ')} · 固定示範日期</span><span class="mobile-hint">向左右滑動月曆，查看完整一週。</span></div><section class="date-agenda" aria-label="所選日期的會議"><div><div class="eyebrow">所選日期</div><div class="date-heading">${shortDate(selectedDate)}</div><small>星期${weekday[dateObj(selectedDate).getUTCDay()]}</small></div><div>${events.length?events.map(m=>{const previous=P.getPrevious(m.id);return `<article class="agenda-row"><div class="agenda-time">${m.start}<br><small>— ${m.end}</small></div><div>${status(m)}<span class="tag">${kind(m)}</span><h3>${E(m.title)}</h3><p class="muted" style="font-size:12px">${E(m.topic)}</p>${previous?`<p class="context-teaser">接續 ${shortDate(previous.date)}：${E(previous.conclusions[0]||'查看上一場會議記錄。')}</p>`:`<p class="context-teaser">${m.kind==='single'?'單場會議，沒有系列歷史。':'此系列尚無先前的會議記錄。'}</p>`}</div><button class="primary" data-meeting="${m.id}">開啟會議記錄 →</button></article>`}).join(''):'<div class="empty"><strong>這天沒有安排會議。</strong>選擇其他日期，或返回今天查看示範會議。</div>'}</div></section></section>`;
}
function tasksHTML(tasks){const visible=tasks.filter(t=>showCompleted||t.status!=='completed');return visible.length?visible.map(t=>`<div class="task ${t.status}"><div>${E(t.text)}</div><div class="task-meta"><span>${E(t.owner)}</span><span>期限 ${E(t.due)}</span><span class="task-state">${({open:'待完成',completed:'已完成',deferred:'已延後'})[t.status]||E(t.status)}</span></div></div>`).join(''):'<p class="empty">沒有未完成的待辦事項。</p>'}
function previousHTML(m){const p=P.getPrevious(m.id);return `<section class="prior" aria-labelledby="prior-title"><div class="section-title"><span class="section-number">01</span><h2 id="prior-title">前次結論與待辦</h2></div>${p?`<div class="prior-grid"><div><div class="small-heading">上次結論 · ${fullDate(p.date)}</div><ul class="conclusions">${p.conclusions.map(c=>`<li>${E(c)}</li>`).join('')}</ul><button class="text-button back" data-meeting="${p.meetingId}">查看上一場會議記錄 ↗</button></div><div><div class="task-heading"><h3>接續待辦</h3><label class="task-filter"><input type="checkbox" id="show-completed" ${showCompleted?'checked':''}>包含已完成</label></div><div id="previous-tasks">${tasksHTML(p.tasks)}</div></div></div>`:`<p class="no-history">${m.kind==='single'?'單場會議，沒有系列歷史。':'這是示範資料中的第一場系列會議，沒有更早的會議紀錄。'}</p>`}</section>`}
function currentHTML(m){
if(m.status==='live')return `<section class="current" aria-labelledby="current-title"><div class="current-heading"><div><div class="section-title"><span class="section-number">02</span><h2 id="current-title">此刻的討論</h2></div><p class="feed-note">模擬即時內容，非實際錄音。<span id="latest-update" class="live-update"></span></p></div><div class="live-controls"><button id="play-demo" class="primary">播放即時示範</button><button id="reset-demo">重設示範</button></div></div><div class="reading-grid"><section class="reading-column" aria-labelledby="transcript-title"><div class="reading-title"><h3 id="transcript-title">逐字稿</h3><small>依發言時間</small></div><div id="transcript-content" role="log" aria-label="示範逐字稿" aria-live="polite" aria-relevant="additions"></div></section><section class="reading-column" aria-labelledby="qa-title"><div class="reading-title"><h3 id="qa-title">問答</h3><small>從本場對話整理</small></div><div id="qa-content" role="log" aria-label="示範問答" aria-live="polite" aria-relevant="additions"></div></section></div></section>`;
const summary=P.getSummary(m.id);
return `<section class="current" aria-labelledby="current-title"><div class="section-title"><span class="section-number">02</span><h2 id="current-title">本場紀錄</h2></div>${m.status==='ended'?`<div class="session-state"><h3>會議已結束，留下共識。</h3><p class="muted">這是已結束的示範會議，沒有即時錄音或播放。</p></div>${summary?`<div class="prior-grid"><div><h3 class="small-heading">本場結論</h3><ul class="conclusions">${summary.conclusions.map(c=>`<li>${E(c)}</li>`).join('')}</ul></div><div><h3 class="small-heading">本場待辦 · 完整狀態</h3>${summary.tasks.map(t=>`<div class="task ${t.status}">${E(t.text)}<div class="task-meta"><span>${E(t.owner)}</span><span>期限 ${E(t.due)}</span><span class="task-state">${({open:'待完成',completed:'已完成',deferred:'已延後'})[t.status]}</span></div></div>`).join('')||'<p class="muted">沒有本場待辦。</p>'}</div></div>`:'<p class="muted">此場沒有提供摘要示範。</p>'}<p class="footnote">此場示範僅提供摘要與待辦，未提供逐字稿與問答。</p>`:`<div class="session-state"><h3>尚未開始，先準備好脈絡。</h3><p class="muted">${fullDate(m.date)} ${m.start} 開始。會議尚未產生逐字稿或問答。</p><p class="muted">${m.kind==='series'?'可先閱讀上一場結論與接續待辦。':'這是一場獨立討論，不會帶入其他系列的紀錄。'}</p></div>`}</section>`;
}
function renderDossier(){
view='dossier';const m=P.getMeeting(selectedId);selectedDate=m.date;month=m.date.slice(0,7);document.getElementById('settings-button').textContent='設定';
root.innerHTML=`<nav class="breadcrumb" aria-label="會議導覽"><button id="back-calendar" class="text-button back">← 返回 ${Number(month.slice(5))} 月月曆</button>${dateControls(true)}</nav><article><header class="dossier-heading"><div><div class="eyebrow">${kind(m)} · 會議手記</div><h1>${E(m.title)}</h1><div class="meeting-meta"><span>${fullDate(m.date)}</span><span>${m.start} — ${m.end}</span><span>${E(m.location)}</span>${status(m)}</div><p class="muted" style="margin-top:12px;font-size:13px">${E(m.topic)}</p></div><div class="folio">${m.date.slice(8)}<small>${m.date.slice(0,7).replace('-',' / ')}</small></div></header>${previousHTML(m)}${currentHTML(m)}<section class="series" aria-labelledby="series-title"><div class="section-title"><span class="section-number">03</span><h2 id="series-title">${m.kind==='series'?'同系列會議':'關於這場會議'}</h2></div>${m.kind==='series'?`<div class="series-list">${P.getSeries(m.id).map(item=>`<button class="series-item" data-meeting="${item.id}" aria-current="${item.id===m.id}"><span class="series-date">${shortDate(item.date)}</span>${status(item)}<small>${item.id===m.id?'正在閱讀':E(item.title)+' →'}</small></button>`).join('')}</div>`:'<p class="no-history">單場會議，沒有系列歷史。此手記只保留本場內容。</p>'}</section><p class="footnote">示範資料 · 所有會議、逐字稿、問答與待辦均為合成內容，不會加入真實會議或修改正式資料。</p></article>`;
if(m.status==='live')updateFeed(feed.snapshot());
}
function updateFeed(s){
if(view!=='dossier'||selectedId!=='product-live')return;
const transcript=document.getElementById('transcript-content'),qa=document.getElementById('qa-content');if(!transcript||!qa)return;
if(transcript.children.length>s.transcript.length)transcript.replaceChildren();
if(qa.children.length>s.qa.length)qa.replaceChildren();
s.transcript.slice(transcript.children.length).forEach(t=>transcript.insertAdjacentHTML('beforeend',`<div class="transcript-row"><time>${E(t.time)}</time><p>${E(t.text)}</p></div>`));
s.qa.slice(qa.children.length).forEach(q=>qa.insertAdjacentHTML('beforeend',`<article class="qa-row"><p class="qa-question"><span class="qa-letter">Q.</span>${E(q.question)}</p><p class="qa-answer"><span class="qa-letter">A.</span>${E(q.answer)}</p><p class="qa-source">${E(q.time)} · 依據：${E(q.source)}</p></article>`));
document.getElementById('latest-update').textContent=` 最近更新 ${s.lastUpdate}${s.finished?' · 示範已播放完畢':''}`;
const play=document.getElementById('play-demo');play.textContent=s.playing?'暫停即時示範':s.finished?'重新播放示範':'播放即時示範';play.setAttribute('aria-pressed',String(s.playing));
}
function openMeeting(id){feed.pause();selectedId=id;showCompleted=false;renderDossier();focusHeading()}
function selectDate(date){feed.pause();selectedDate=date;month=date.slice(0,7);const events=onDate(date);selectedId=events[0]?.id||null;renderCalendar()}
function renderSettings(){view='settings';document.getElementById('settings-button').textContent='返回工作區';root.innerHTML=`<section class="settings"><button id="back-settings" class="text-button back">← 返回${returnView==='dossier'?'會議記錄':'月曆'}</button><div class="eyebrow" style="margin-top:27px">個人工作區</div><h1>設定</h1><p class="settings-intro">連線資訊與閱讀偏好，與會議內容分開管理。</p><section class="settings-section"><h2>連線</h2><div class="setting-row"><div><h3>Microsoft Teams</h3><p>此提案使用合成會議，沒有連結任何真實帳號。</p></div><span class="setting-value">未連線 · 唯讀範例</span></div><div class="setting-row"><div><h3>日曆來源</h3><p>固定於 2026 年 10 月的示範日曆。</p></div><span class="setting-value">示範資料</span></div></section><section class="settings-section"><h2>閱讀偏好</h2><label class="setting-row" for="demo-preference"><span><strong>減少動態效果</strong><p>記憶體內的偏好範例；切換後可看到下方狀態，不影響正式設定。</p></span><input id="demo-preference" class="switch" type="checkbox" ${compactPreference?'checked':''}></label><p id="preference-state" class="muted" style="font-size:12px;margin-top:12px">示範偏好：${compactPreference?'已開啟減少動態效果':'未開啟減少動態效果'}。本提案本身不使用轉場動畫。</p><div class="setting-row"><div><h3>顯示語言</h3><p>內容以繁體中文呈現。</p></div><span class="setting-value">繁體中文 · 唯讀</span></div></section><p class="settings-notice">僅示範，不會修改正式設定。偏好只保留於此頁記憶體，重新整理後還原。沒有帳號授權、實際錄音或會議控制。</p></section>`;focusHeading()}
function closeSettings(){returnView==='dossier'?renderDossier():renderCalendar();focusHeading()}
document.getElementById('settings-button').addEventListener('click',()=>{if(view==='settings'){closeSettings();return}returnView=view;feed.pause();renderSettings()});
root.addEventListener('click',event=>{
const button=event.target.closest('button');if(!button)return;
if(button.dataset.meeting){openMeeting(button.dataset.meeting);return}
if(button.dataset.date){selectDate(button.dataset.date);const target=root.querySelector(`[data-date="${selectedDate}"]`);target?.focus({preventScroll:true});return}
switch(button.id){case'previous-month':case'next-month':{const d=dateObj(month+'-01');d.setUTCMonth(d.getUTCMonth()+(button.id==='next-month'?1:-1));selectDate(dateString(d));root.querySelector('#'+button.id)?.focus({preventScroll:true});break}case'previous-day':case'next-day':selectDate(addDays(selectedDate,button.id==='next-day'?1:-1));focusHeading();break;case'today-button':selectDate(P.today);break;case'back-calendar':feed.pause();renderCalendar();focusHeading();break;case'back-settings':closeSettings();break;case'play-demo':{const state=feed.snapshot();if(state.playing)feed.pause();else{if(state.finished)feed.reset();feed.play()}updateFeed(feed.snapshot());break}case'reset-demo':feed.reset();updateFeed(feed.snapshot());break}
});
root.addEventListener('change',event=>{if(event.target.id==='date-picker'&&/^\d{4}-\d{2}-\d{2}$/.test(event.target.value)){selectDate(event.target.value);root.querySelector('#date-picker')?.focus({preventScroll:true})}if(event.target.id==='show-completed'){showCompleted=event.target.checked;document.getElementById('previous-tasks').innerHTML=tasksHTML(P.getPrevious(selectedId).tasks)}if(event.target.id==='demo-preference'){compactPreference=event.target.checked;document.getElementById('preference-state').textContent=`示範偏好：${compactPreference?'已開啟減少動態效果':'未開啟減少動態效果'}。本提案本身不使用轉場動畫。`}});
renderCalendar();
})();
</script>
</body>
</html>
