# Installed/reviewed by the VM administrator; never used from a runner checkout.
services:
  teams-transcription:
    image: ${TRANSCRIPTION_IMAGE:?digest_required}
    platform: linux/arm64
    user: "10001:10001"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./chromium-seccomp.json
    env_file: [./runtime.env]
    environment:
      ASSISTANT_HOST: 0.0.0.0
      ASSISTANT_PORT: '8080'
      ASSISTANT_DATA_ROOT: /data
    command: [serve, --config, /data/config/runtime.yml]
    ports: ["127.0.0.1:18081:8080"]
    volumes:
      - type: volume
        source: staging-data
        target: /data
    tmpfs: ["/tmp:size=512m,mode=1777"]
    shm_size: 1gb
    mem_limit: 4g
    cpus: 2
    pids_limit: 512
    stop_grace_period: 45s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, teams-transcription, healthcheck, --port, '8080']
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
volumes:
  staging-data:
    external: true
    name: teams-staging-data
