services:
  teams-transcription:
    image: ${TRANSCRIPTION_IMAGE:?set_pinned_image}
    platform: ${CONTAINER_PLATFORM:-}
    user: "${PUID:?set_nonroot_uid}:${PGID:?set_gid}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./docker/chromium-seccomp.json
    env_file: ["${CONFIG_ENV_FILE:-.env}"]
    command: [serve, --config, /data/config/runtime.yml]
    expose: ["${ASSISTANT_PORT:-8080}"]
    volumes:
      - type: bind
        source: ${APPDATA_HOST:?set_private_appdata_absolute_path}
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: ${SHM_SIZE:-1gb}
    mem_limit: ${MEM_LIMIT:-4g}
    cpus: ${CPU_LIMIT:-2}
    pids_limit: ${PIDS_LIMIT:-512}
    stop_grace_period: ${STOP_GRACE:-45s}
    healthcheck:
      test: [CMD, teams-transcription, healthcheck, --port, "${ASSISTANT_PORT:-8080}"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
